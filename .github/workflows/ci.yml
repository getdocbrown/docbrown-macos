name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test import, search, hooks, and attribution
        run: swift test
      - name: Build universal app and CLI
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DocBrown-macOS
          path: |
            build/DocBrown-0.1.0-macOS.zip
            build/SHA256SUMS.txt
