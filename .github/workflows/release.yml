name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/build-release.sh
      - name: Test real updater installation and signature rejection
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/test-updater.py
      - name: Sign update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/generate-appcast.sh
      - name: Publish verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md
          gh release create "$GITHUB_REF_NAME" build/DocBrown-*-macOS.zip build/SHA256SUMS.txt build/appcast.xml --draft --verify-tag --title "DocBrown $GITHUB_REF_NAME" --notes-file build/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
